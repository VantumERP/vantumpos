[package]
name = "vantumpos"
version = "0.1.0"
description = "Local-first POS desktop app for Serbian retail stores"
authors = ["Actaer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vantumpos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }
# The audit log's tamper-evidence (SW-10 req. 7) is a SHA-256 hash chain. Already
# present transitively via the password/crypto stack; declared here because
# `audit.rs` depends on it directly.
sha2 = "0.10"

[dev-dependencies]
# Enables `tauri::test` (mock_builder/mock_context) so command wrappers that take
# `State<'_, AppState>` can be exercised in unit tests (e.g. admin-gate rejection).
tauri = { version = "2", features = ["test"] }
